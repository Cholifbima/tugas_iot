name: Deploy ke Azure Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-webapp
  cancel-in-progress: true

jobs:
  deploy:
    # Dilewati sampai variabel AZURE_WEBAPP_NAME diisi di Settings > Secrets and variables > Actions.
    if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan paket situs
        run: |
          mkdir site
          cp -r index.html server.js package.json vendor site/

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: site
