name: Deploy ke Azure Web App - SmartPlant

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-webapp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Hanya berkas situs yang dikirim; tidak ada dependensi, jadi tidak perlu npm install.
      - name: Siapkan paket situs
        run: |
          mkdir site
          cp -r index.html server.js package.json vendor site/

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: SmartPlant
          slot-name: Production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: site
